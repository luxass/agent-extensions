name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: luxass/shared-workflows/.github/workflows/reusable-ci.yaml@10298e06aecc428b39ef4121636400396b53a1fa # v0.16.0
    with:
      node-version: "24"
      build: false
      lint: true
      lint-script: "lint"
      typecheck: true
      typecheck-script: "typecheck"
      fmt: true
      fmt-script: "fmt:check"
