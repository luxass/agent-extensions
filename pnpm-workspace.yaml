packages:
  - packages/*

ignoreScripts: true
minimumReleaseAge: 7200
trustPolicy: no-downgrade
catalogMode: prefer
strictDepBuilds: true
blockExoticSubdeps: true

overrides:
  semver: 7.8.5

minimumReleaseAgeExclude:
  # OpenCode
  - "@opencode/ai@2.1.1"
  - "@opencode/client@2.1.1"
  - "@opencode/plugin@2.1.1"
  - "@opencode/protocol@2.1.1"
  - "@opencode/schema@2.1.1"
  - "@opencode/util@2.1.1"

catalogs:
  types:
    "@types/node": 26.6.5
    "@types/react": 19.3.0

  pi:
    "@earendil-works/pi-ai": 1.5.0
    "@earendil-works/pi-coding-agent": 1.5.0
    "@earendil-works/pi-schema": 1.5.0
    "@earendil-works/pi-tui": 1.5.0

  opencode:
    "@opencode/plugin": 2.1.1
    "@opentui/solid": 0.6.6
    effect: 4.0.5

  voice:
    "@luxass/agent-voice": 0.5.2

  release:
    "@changesets/changelog-github": 1.0.1
    "@changesets/cli": 3.0.3

  covers:
    "@resvg/resvg-js": 2.6.2
    react: 19.3.1
    satori: 0.62.0

  lint:
    oxfmt: 0.73.0
    oxlint: 1.88.0
    oxlint-tsgolint: 7.0.2004

  compiler:
    typescript: 7.0.2
